name: Parallel Multiplatform Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit message
        id: check
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"
          if echo "$MSG" | grep -q "RELEASE"; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build-unix:
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate Version
        id: vars
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR_PART=$((COUNT / 100))
          MINOR_PART=$(printf "%02d" $((COUNT % 100)))
          echo "version=1.$MAJOR_PART.$MINOR_PART" >> $GITHUB_OUTPUT
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'
      - name: Build Android & Linux
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleDebug :composeApp:packageDeb -PappVersion=${{ steps.vars.outputs.version }}
      - name: Find .deb file
        id: deb
        run: |
          DEB_PATH=$(find composeApp/build -name "*.deb" | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            exit 1
          fi
          echo "path=$DEB_PATH" >> $GITHUB_OUTPUT
      - name: Prepare Files
        run: |
          mkdir -p release-artifacts
          cp composeApp/build/outputs/apk/debug/*.apk \
            release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.apk
          cp "${{ steps.deb.outputs.path }}" \
            release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.deb
      - name: Upload Linux & Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Burn t out ${{ steps.vars.outputs.version }}
          prerelease: ${{ startsWith(steps.vars.outputs.version, '1.') }}
          files: release-artifacts/*
          body: |
            ## 📦 Instalación
            Descarga el archivo correspondiente a tu plataforma:

            | Plataforma | Extension |
            | --- | --- |
            | Windows | .msi |
            | Linux (Debian) | .deb |
            | Android | .apk |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate Version
        id: vars
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD | tr -d '[:space:]')
          MAJOR_PART=$((COUNT / 100))
          MINOR_PART=$(printf "%02d" $((COUNT % 100)))
          echo "version=1.$MAJOR_PART.$MINOR_PART" | tr -d '\r' >> $GITHUB_OUTPUT
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'
      - name: Build Windows
        run: |
          ./gradlew :composeApp:packageMsi "-PappVersion=${{ steps.vars.outputs.version }}"
      - name: Prepare Files
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp composeApp/build/compose/binaries/main/msi/*.msi \
            release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.msi
      - name: Upload Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Burn t out ${{ steps.vars.outputs.version }}
          prerelease: ${{ startsWith(steps.vars.outputs.version, '1.') }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      
  deploy-aur:
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: vars
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR_PART=$((COUNT / 100))
          MINOR_PART=$(printf "%02d" $((COUNT % 100)))
          echo "version=1.$MAJOR_PART.$MINOR_PART" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.vars.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          docker run --rm -v "$PWD:/pkg" archlinux:latest bash -c \
            "pacman -Sy --noconfirm binutils && cd /pkg && makepkg --printsrcinfo > .SRCINFO"

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: burnt-out
          pkgbuild: ./PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: tu@email.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.vars.outputs.version }}"
          force_push: true
