name: Parallel Multiplatform Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-unix:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RELEASE') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: vars
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR_PART=$((COUNT / 100))
          MINOR_PART=$(printf "%02d" $((COUNT % 100)))
          echo "version=1.$MAJOR_PART.$MINOR_PART" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Android & Linux
        run: | 
            chmod +x gradlew
            ./gradlew :composeApp:assembleDebug :composeApp:packageDeb

      - name: Find .deb file
        id: deb
        run: |
          DEB_PATH=$(find composeApp/build -name "*.deb" | head -n 1)
          if [ -z "$DEB_PATH" ]; then
            exit 1
          fi
          echo "path=$DEB_PATH" >> $GITHUB_OUTPUT

      - name: Prepare Files
        run: |
          mkdir -p release-artifacts
          cp composeApp/build/outputs/apk/debug/*.apk \
            release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.apk
          cp "${{ steps.deb.outputs.path }}" \
            release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.deb

      - name: Upload Linux & Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Burn t out ${{ steps.vars.outputs.version }}
          prerelease: ${{ startsWith(steps.vars.outputs.version, '1.') }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RELEASE') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: vars
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR_PART=$((COUNT / 100))
          MINOR_PART=$(printf "%02d" $((COUNT % 100)))
          echo "version=1.$MAJOR_PART.$MINOR_PART" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Windows
        run: ./gradlew :composeApp:packageMsi

      - name: Prepare Files
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp composeApp/build/compose/binaries/main/msi/*.msi \
            release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.msi

      - name: Upload Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Burn t out ${{ steps.vars.outputs.version }}
          prerelease: ${{ startsWith(steps.vars.outputs.version, '1.') }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
