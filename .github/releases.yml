name: Parallel Multiplatform Release

on:
  workflow_dispatch:

jobs:
  build-unix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: vars
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR_PART=$((COUNT / 100))
          MINOR_PART=$(printf "%02d" $((COUNT % 100)))
          echo "version=1.$MAJOR_PART.$MINOR_PART" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Android & Linux
        run: ./gradlew :composeApp:assembleDebug :composeApp:packageDeb

      - name: Prepare Files
        run: |
          mkdir -p release-artifacts
          cp composeApp/build/outputs/apk/debug/*.apk release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.apk
          cp composeApp/build/compose/binaries/main/deb/*.deb release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.deb

      - name: Upload Linux & Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Release ${{ steps.vars.outputs.version }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: vars
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          MAJOR_PART=$((COUNT / 100))
          MINOR_PART=$(printf "%02d" $((COUNT % 100)))
          echo "version=1.$MAJOR_PART.$MINOR_PART" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build Windows
        run: ./gradlew :composeApp:packageMsi

      - name: Prepare Files
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp composeApp/build/compose/binaries/main/msi/*.msi release-artifacts/burnt-out-${{ steps.vars.outputs.version }}-installer.msi

      - name: Upload Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Release ${{ steps.vars.outputs.version }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
