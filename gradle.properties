#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Optimization suggested by log
android.dependency.excludeLibraryComponentsFromConstraints=true
# Suppress sync warning for library constraints
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# These flags are REQUIRED for AGP 9.0+ compatibility with Kotlin Multiplatform in the same module
# Restored to fix the build error: "The com.android.application plugin is not compatible with KMP"
android.builtInKotlin=false
android.newDsl=false

# Other compatibility flags (required by AGP 9.x for legacy project structures)
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
